<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>活动运营数据看板</title>
  <link rel="stylesheet" href="css/custom.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    // embed mode: ?embed=1 隐藏header/密码/减少padding
    window.isEmbedMode = new URLSearchParams(location.search).get('embed') === '1';
  </script>
  <style>
    body.embed-mode { background: transparent !important; padding: 0 !important; }
    body.embed-mode .header { display: none !important; }
    body.embed-mode #auth-overlay { display: none !important; }
    body.embed-mode .tab-bar { margin-top: 0; }
  </style>
</head>
<body>

  <!-- 密码验证遮罩 -->
  <div id="auth-overlay" style="position:fixed;inset:0;z-index:9999;background:#F8FAFC;display:flex;align-items:center;justify-content:center">
    <div style="text-align:center;max-width:360px;padding:40px">
      <div style="font-size:40px;margin-bottom:16px">🔒</div>
      <h2 style="font-size:20px;font-weight:700;color:#1E293B;margin-bottom:8px">活动运营数据看板</h2>
      <p style="font-size:13px;color:#64748B;margin-bottom:24px">请输入访问密码</p>
      <input type="password" id="auth-input" placeholder="输入密码" autocomplete="off"
        style="width:100%;padding:10px 16px;border:2px solid #E2E8F0;border-radius:8px;font-size:14px;outline:none;text-align:center;letter-spacing:2px"
        onkeyup="if(event.key==='Enter')checkAuth()">
      <button onclick="checkAuth()"
        style="width:100%;margin-top:12px;padding:10px;background:#2563EB;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer">
        进入看板
      </button>
      <div id="auth-error" style="color:#DC2626;font-size:12px;margin-top:8px;display:none">密码错误</div>
    </div>
  </div>

  <script>
    // 密码验证（localStorage 存储，7天有效）
    const AUTH_KEY = 'act_dashboard_auth';
    const AUTH_EXPIRE_KEY = 'act_dashboard_auth_expire';
    const AUTH_HASH = '508f4a3fd1792f8b8e37ba9f6fcc4bd587301bcec38931186939c8db9888f831'; // sha256('act2026')
    const AUTH_DAYS = 7;

    async function sha256(text) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function checkAuth() {
      const input = document.getElementById('auth-input').value;
      const hash = await sha256(input);
      if (hash === AUTH_HASH) {
        localStorage.setItem(AUTH_KEY, 'true');
        localStorage.setItem(AUTH_EXPIRE_KEY, String(Date.now() + AUTH_DAYS * 86400000));
        document.getElementById('auth-overlay').style.display = 'none';
      } else {
        document.getElementById('auth-error').style.display = 'block';
        document.getElementById('auth-input').style.borderColor = '#DC2626';
        setTimeout(() => {
          document.getElementById('auth-error').style.display = 'none';
          document.getElementById('auth-input').style.borderColor = '#E2E8F0';
        }, 2000);
      }
    }

    // 已验证且未过期则跳过
    const expireAt = Number(localStorage.getItem(AUTH_EXPIRE_KEY) || 0);
    if (localStorage.getItem(AUTH_KEY) === 'true' && Date.now() < expireAt) {
      document.getElementById('auth-overlay').style.display = 'none';
    } else {
      localStorage.removeItem(AUTH_KEY);
      localStorage.removeItem(AUTH_EXPIRE_KEY);
    }
  </script>

  <script>
    if (window.isEmbedMode) document.body.classList.add('embed-mode');
  </script>

  <!-- Header -->
  <div class="header">
    <h1>📊 活动运营数据看板</h1>
    <div class="meta">
      <div class="period-selector">
        <button class="period-btn" data-period="today" onclick="switchPeriod('today')">当日</button>
        <button class="period-btn active" data-period="7d" onclick="switchPeriod('7d')">近7日</button>
        <button class="period-btn" data-period="30d" onclick="switchPeriod('30d')">近30日</button>
      </div>
      <div class="period-selector" style="margin-left:4px">
        <button class="metric-btn active" data-metric="uv" onclick="switchMetricType('uv')">UV</button>
        <button class="metric-btn" data-metric="pv" onclick="switchMetricType('pv')">PV</button>
      </div>
      <span id="update-time">数据加载中...</span>
    </div>
  </div>

  <!-- Tab Bar -->
  <div class="tab-bar">
    <div class="tab-item active" data-tab="best-practice" onclick="switchTab('best-practice')">
      🏆 行业最佳实践
    </div>
    <div class="tab-item" data-tab="brand-diagnosis" onclick="switchTab('brand-diagnosis')">
      🔍 品牌诊断
    </div>
    <div class="tab-item" data-tab="activity-detail" onclick="switchTab('activity-detail')">
      📋 品牌活动明细
    </div>
    <div class="tab-item" data-tab="activity-alerts" onclick="switchTab('activity-alerts')">
      ⚠️ 活动预警
    </div>
  </div>

  <!-- Tab 1: 行业最佳实践 -->
  <div id="best-practice-section" class="tab-content">
    <div id="best-practice-container">
      <div class="loading"><div class="spinner"></div><p>加载数据中...</p></div>
    </div>
  </div>

  <!-- Tab 2: 品牌诊断 -->
  <div id="brand-diagnosis-section" class="tab-content" style="display:none;">
    <div id="diagnosis-container">
      <div class="loading"><div class="spinner"></div><p>加载数据中...</p></div>
    </div>
  </div>

  <!-- Tab 2: 品牌活动明细 -->
  <div id="detail-section" class="tab-content" style="display:none;">
    <div class="filter-bar">
      <div class="filter-left">
        <label class="filter-label">类目</label>
        <select id="category-filter" onchange="filterDetailData()">
          <option value="">全部类目</option>
        </select>

        <label class="filter-label">品牌</label>
        <div style="position:relative;display:inline-block">
          <input type="text" id="brand-search" placeholder="名称或ID" autocomplete="off"
            oninput="showBrandDropdown(this.value)" onfocus="showBrandDropdown(this.value)"
            onkeyup="if(event.key==='Enter'){hideBrandDropdown();filterDetailData()}">
          <div id="brand-search-dropdown" class="search-dropdown" style="display:none"></div>
        </div>

        <div class="multi-select-wrap" id="ms-assistant"></div>
        <div class="multi-select-wrap" id="ms-sp"></div>
        <div class="multi-select-wrap" id="ms-owner"></div>

        <button class="btn-primary btn-sm" onclick="filterDetailData()">搜索</button>
      </div>
      <div class="filter-right">
        <button class="btn-secondary" onclick="exportDetailCSV()">📥 导出CSV</button>
      </div>
    </div>

    <div class="detail-table-wrap">
      <table class="detail-table">
        <thead>
          <tr>
            <th class="group-header" colspan="6">基础信息</th>
            <th class="group-header" colspan="3">对接信息</th>
            <th class="group-header" colspan="5">活动信息</th>
            <th class="group-header" colspan="6">UV 数据</th>
            <th class="group-header" colspan="6">PV 数据</th>
            <th class="group-header" colspan="1">到店</th>
            <th class="group-header" colspan="1">门槛</th>
          </tr>
          <tr>
            <th>类目</th>
            <th>品牌ID</th>
            <th>品牌名称</th>
            <th>门店数</th>
            <th>日均交易笔数</th>
            <th>小程序占比</th>
            <th>对接助理</th>
            <th>服务商</th>
            <th>负责人</th>
            <th>活动ID</th>
            <th>活动名称</th>
            <th>批次名称</th>
            <th>价格力</th>
            <th>库存</th>
            <th>曝光UV</th>
            <th>领取UV</th>
            <th>核销UV</th>
            <th>曝光领取率</th>
            <th>领取核销率</th>
            <th>曝光核销率</th>
            <th>曝光PV</th>
            <th>领取PV</th>
            <th>核销PV</th>
            <th>曝光领取率</th>
            <th>领取核销率</th>
            <th>曝光核销率</th>
            <th>到店核销率</th>
            <th>未达门槛占比</th>
          </tr>
        </thead>
        <tbody id="detail-table-body">
          <tr><td colspan="28" style="text-align:center;padding:32px;color:var(--text-muted)">加载中...</td></tr>
        </tbody>
      </table>
    </div>

    <div id="pagination" class="pagination"></div>
  </div>

  <!-- Tab 4: 活动预警 -->
  <div id="alert-section" class="tab-content" style="display:none;">
    <div id="alert-container">
      <div class="loading"><div class="spinner"></div><p>加载数据中...</p></div>
    </div>
  </div>

  <!-- Export canvas (hidden) -->
  <div id="export-canvas-area"></div>

  <!-- Scripts -->
  <script src="js/supabase-config.js"></script>
  <script src="js/best-practice.js"></script>
  <script src="js/brand-diagnosis.js"></script>
  <script src="js/activity-detail.js"></script>
  <script src="js/activity-alerts.js"></script>
  <script>
    let diagInitialized = false;
    let alertsInitialized = false;

    function switchTab(tabName) {
      document.querySelectorAll('.tab-item').forEach(t => {
        t.classList.toggle('active', t.dataset.tab === tabName);
      });
      document.getElementById('best-practice-section').style.display = tabName === 'best-practice' ? '' : 'none';
      document.getElementById('brand-diagnosis-section').style.display = tabName === 'brand-diagnosis' ? '' : 'none';
      document.getElementById('detail-section').style.display = tabName === 'activity-detail' ? '' : 'none';
      document.getElementById('alert-section').style.display = tabName === 'activity-alerts' ? '' : 'none';

      if (tabName === 'activity-detail' && detailData.length === 0) {
        loadActivityDetail();
      }
      if (tabName === 'brand-diagnosis' && !diagInitialized) {
        diagInitialized = true;
        initDiagnosis();
      }
      if (tabName === 'activity-alerts' && !alertsInitialized) {
        alertsInitialized = true;
        loadActivityAlerts();
      }
    }

    function switchPeriod(period) {
      window.currentPeriod = period;
      document.querySelectorAll('.period-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.period === period);
      });
      // 重新加载当前 Tab 的数据
      const activeTab = document.querySelector('.tab-item.active')?.dataset.tab;
      // Reset flags so data reloads
      diagInitialized = false;
      alertsInitialized = false;
      detailData = [];
      // Reload
      loadBestPracticeData();
      if (activeTab === 'brand-diagnosis') { diagInitialized = true; initDiagnosis(); }
      if (activeTab === 'activity-detail') { loadActivityDetail(); }
      if (activeTab === 'activity-alerts') { alertsInitialized = true; loadActivityAlerts(); }
      // Update date display
      updateDateDisplay();
    }

    function switchMetricType(type) {
      window.currentMetricType = type;
      document.querySelectorAll('.metric-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.metric === type);
      });
      // 纯前端重新渲染，不重新请求数据
      // Tab0: 重算指标+重渲染
      if (allActivitiesForBP.length > 0) {
        recomputeBestPractice();
        renderLayer1();
      }
      // Tab1: 如果已有诊断结果，重新计算渲染
      if (diagCurrentBrand) {
        computeCategoryStats();
        runDiagnosis();
      }
    }

    async function updateDateDisplay() {
      const { data } = await supabaseClient
        .from('tem_activity_daily')
        .select('report_date')
        .order('report_date', { ascending: false })
        .limit(1);
      if (data && data.length > 0) {
        document.getElementById('update-time').textContent = '数据日期: ' + data[0].report_date;
      } else {
        document.getElementById('update-time').textContent = '暂无数据';
      }
    }

    document.addEventListener('DOMContentLoaded', async () => {
      loadBestPracticeData();
      updateDateDisplay();
    });
  </script>

</body>
</html>
